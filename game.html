<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Бинго — логопедическая игра</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="appearance.css">
  <link rel="stylesheet" href="preview.css">
  <link rel="stylesheet" href="choice-game.css">
  <link rel="stylesheet" href="sorting-game.css">
  <link rel="stylesheet" href="pairs-game.css">
  <link rel="stylesheet" href="sequence-game.css">
  <link rel="stylesheet" href="task-typography.css">
  <link rel="stylesheet" href="tokens.css">
  <script defer src="content.js"></script>
  <script defer src="cards.js"></script>
  <script defer src="tokens.js"></script>
  <script defer src="tasks.js"></script>
  <script defer src="settings.js"></script>
  <script defer src="game.js"></script>
  <script defer src="choice-game.js"></script>
  <script defer src="sorting-game.js"></script>
  <script defer src="pairs-game.js"></script>
  <script defer src="sequence-game.js"></script>
  <script defer src="app.js"></script>
  <script defer src="appearance.js"></script>
  <script defer src="appearance-game.js"></script>
</head>
<body id="preview">
  <div class="shell">
    <header class="topbar">
      <button class="reset" id="reset" type="button"><span aria-hidden="true">↻</span> Начать заново</button>
    </header>
    <main>
      <div class="intro">
        <h1 id="game-title">Бинго</h1>
        <dl class="game-rules">
          <div><dt>Условие победы</dt><dd id="victory-rule"></dd></div>
        </dl>
      </div>
      <div class="table">
        <div class="boards" id="boards"></div>
        <aside class="draw-panel" aria-labelledby="draw-title">
          <h2 id="draw-title">Выпавшая карточка</h2>
          <div class="draw-slot" id="draw-slot"></div>
          <button id="draw" class="primary" type="button">Достать карточку</button>
          <p class="status" id="status" role="status"></p>
        </aside>
      </div>
    </main>
  </div>
  <div id="turn-notice" class="turn-notice" role="status" aria-atomic="true" hidden>
    <strong>Переход хода</strong>
    <span id="next-player"></span>
  </div>
  <dialog id="task" aria-label="Устное задание">
    <div class="task-sheet">
      <div class="task-body" id="task-body" hidden>
        <p class="task-text" id="task-text" hidden></p>
        <div class="task-images" id="task-images" hidden></div>
        <div id="task-choice" hidden></div>
      </div>
      <audio id="task-audio" controls aria-label="Аудио задания" hidden></audio>
      <button id="check-choice" class="task-action" type="button" hidden>Проверить</button>
      <button id="close-task-preview" class="task-action" type="button" hidden>Закрыть предпросмотр</button>
      <button id="complete" class="task-action" type="button">Задание выполнено</button>
    </div>
  </dialog>
</body>
</html>
